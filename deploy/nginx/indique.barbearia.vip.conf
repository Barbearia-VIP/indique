# Landing page "Indique um amigo" — Barbearia VIP
# https://indique.barbearia.vip
#
# Arquivos estáticos gerados por `npm run build` e publicados por scripts/deploy.sh em:
#   /var/www/indique.barbearia.vip/current -> releases/<data-hora>-<commit>
#
# Instalação: `scripts/deploy.sh setup` copia este arquivo para o servidor, emite o
# certificado do Let's Encrypt (certbot, modo webroot) e recarrega o nginx.
# Este arquivo é incluído dentro do bloco `http {}` (sites-enabled/ ou conf.d/).

# Cache por tipo de arquivo. Definido via map para não repetir `add_header` nas
# locations (no nginx, um add_header na location descarta os headers do server).
map $uri $indique_cache_control {
    ~^/assets/       "public, max-age=31536000, immutable";  # nomes com hash do Vite
    ~^/img/          "public, max-age=604800";
    /favicon.svg     "public, max-age=604800";
    default          "no-cache";                             # index.html sempre revalidado
}

# HTTP: validação do Let's Encrypt e redirecionamento para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name indique.barbearia.vip;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://indique.barbearia.vip$request_uri;
    }
}

# HTTPS
server {
    # `listen ... http2` funciona do nginx 1.18 ao atual (no 1.25.1+ dá só um aviso)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name indique.barbearia.vip;

    ssl_certificate     /etc/letsencrypt/live/indique.barbearia.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indique.barbearia.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:indique_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/indique.barbearia.vip/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/indique.barbearia.vip.access.log;
    error_log  /var/log/nginx/indique.barbearia.vip.error.log warn;

    # Cabeçalhos
    add_header Cache-Control $indique_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # A página só carrega arquivos do próprio domínio (fontes empacotadas no build).
    # 'unsafe-inline' em style-src é necessário para as animações (style inline do Framer Motion).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # Caminhos inexistentes (link de campanha digitado errado) voltam para a página
    location / {
        try_files $uri $uri/ =404;
        error_page 404 = @pagina;
    }

    location @pagina {
        return 302 /;
    }

    # Arquivos ocultos (.git, .env etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
